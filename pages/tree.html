<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Family Tree | Branching Out Heritage
</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

<div class="nav-container">

<h1>
🌳 Branching Out Heritage
</h1>


<nav>

<a href="../index.html">
Home
</a>

<a href="tree.html">
Family Tree
</a>

</nav>


</div>

</header>




<section class="section">


<div class="section-title">

<h2>
My Family Tree
</h2>

<p>
Build and explore your family history.
</p>

</div>





<div class="card">


<h2>
Add Family Member
</h2>



<input
id="firstName"
placeholder="First Name"
>



<input
id="lastName"
placeholder="Last Name"
>




<select id="parentSelect">

<option value="">
No Parent
</option>

</select>

<select id="spouseSelect">

<option value="">
No Spouse
</option>

</select>




<button id="addPersonButton">

Add Family Member

</button>


</div>






<br>





<div class="card">


<h2>
Family Tree
</h2>



<div id="tree"

style="
height:650px;
width:100%;
background:#f5f7f2;
border-radius:16px;
">

</div>



</div>


</section>








<!-- PROFILE WINDOW -->


<div id="profileBox"

style="
display:none;
position:fixed;
right:20px;
top:80px;
width:350px;
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
z-index:100;
max-height:80vh;
overflow:auto;
">


<h2 id="profileName">

</h2>



<div id="profileInfo">

</div>



<hr>



<h3>
Edit Record
</h3>




<input
id="birthDate"
placeholder="Birth Date"
>



<input
id="birthPlace"
placeholder="Birth Place"
>



<input
id="deathDate"
placeholder="Death Date"
>



<input
id="deathPlace"
placeholder="Death Place"
>



<input
id="occupation"
placeholder="Occupation"
>



<textarea
id="biography"
placeholder="Biography"
></textarea>




<br><br>




<button id="saveProfileButton">

Save

</button>




<button id="closeProfileButton">

Close

</button>

<hr>

<h3>
Relationships
</h3>


<select id="relationshipPersonSelect">

<option value="">
Choose Person
</option>

</select>


<select id="relationshipType">

<option value="spouse">
Spouse
</option>

<option value="parent">
Parent
</option>

<option value="child">
Child
</option>

</select>


<button id="addRelationshipButton">

Add Relationship

</button>


<div id="relationshipList">

</div>



</div>








<script type="module" src="../js/app.js"></script>

<script type="module" src="../js/familytree.js"></script>

<script type="module" src="../js/profiles.js"></script>



</body>

</html>
